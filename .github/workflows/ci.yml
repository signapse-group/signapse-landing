name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_TO_CLOUDFLARE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      PUBLIC_APP_ORIGIN: ${{ github.ref == 'refs/heads/main' && vars.PUBLIC_APP_ORIGIN || 'http://localhost:3000' }}
      PUBLIC_CONTACT_API_ORIGIN: ${{ github.ref == 'refs/heads/main' && vars.PUBLIC_CONTACT_API_ORIGIN || 'https://dev-api.signapse.cloud' }}
      CONTACT_API_ORIGIN_CONFIGURED: ${{ vars.PUBLIC_CONTACT_API_ORIGIN != '' }}
      SIGNAPSE_PUBLIC_ORIGIN: ${{ github.ref == 'refs/heads/main' && vars.SIGNAPSE_PUBLIC_ORIGIN || '' }}
      SIGNAPSE_LANDING_INDEXABLE: ${{ github.ref == 'refs/heads/main' && vars.SIGNAPSE_LANDING_INDEXABLE == 'true' && 'true' || 'false' }}
      SIGNAPSE_VERCEL_ANALYTICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment origins
        if: env.DEPLOY_TO_CLOUDFLARE == 'true'
        run: |
          node --input-type=module -e '
            const app = new URL(process.env.PUBLIC_APP_ORIGIN);
            const landing = new URL(process.env.SIGNAPSE_PUBLIC_ORIGIN);
            const contactApi = new URL(process.env.PUBLIC_CONTACT_API_ORIGIN);
            if (app.protocol !== "https:" || app.origin === landing.origin || app.hostname === "www.signapse.cloud")
              throw new Error("PUBLIC_APP_ORIGIN must be a separate HTTPS application origin.");
            if (landing.origin !== "https://signapse.cloud")
              throw new Error("Set SIGNAPSE_PUBLIC_ORIGIN to https://signapse.cloud in GitHub Variables.");
            if (process.env.CONTACT_API_ORIGIN_CONFIGURED !== "true")
              throw new Error("Set PUBLIC_CONTACT_API_ORIGIN in GitHub Variables before deploying the contact form.");
            if (contactApi.protocol !== "https:" || contactApi.username || contactApi.password || contactApi.pathname !== "/" || contactApi.search || contactApi.hash)
              throw new Error("PUBLIC_CONTACT_API_ORIGIN must be an HTTPS origin without credentials, path, query or fragment.");
          '

      - name: Check types
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Verify demo timelines
        run: pnpm test:models

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify production preview in browser
        run: pnpm test:browser

      - name: Deploy verified static output to Cloudflare
        if: env.DEPLOY_TO_CLOUDFLARE == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
