name: Verify

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SIGNAPSE_BUILD_REVISION: ${{ github.sha }}
      LANDING_ENVIRONMENT: ${{ (github.ref == 'refs/heads/dev' || github.base_ref == 'dev') && 'dev' || '' }}
      DEPLOY_TO_CLOUDFLARE: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
      PUBLIC_APP_ORIGIN: ${{ github.ref == 'refs/heads/dev' && vars.DEV_PUBLIC_APP_ORIGIN || github.ref == 'refs/heads/main' && vars.PUBLIC_APP_ORIGIN || 'http://localhost:3000' }}
      PUBLIC_CONTACT_API_ORIGIN: ${{ github.ref == 'refs/heads/dev' && vars.DEV_PUBLIC_CONTACT_API_ORIGIN || github.ref == 'refs/heads/main' && vars.PUBLIC_CONTACT_API_ORIGIN || 'https://dev-api.signapse.cloud' }}
      CONTACT_API_ORIGIN_CONFIGURED: ${{ github.ref == 'refs/heads/dev' && vars.DEV_PUBLIC_CONTACT_API_ORIGIN != '' || github.ref == 'refs/heads/main' && vars.PUBLIC_CONTACT_API_ORIGIN != '' }}
      PUBLIC_BLOG_API_ORIGIN: ${{ github.ref == 'refs/heads/dev' && vars.DEV_PUBLIC_BLOG_API_ORIGIN || github.ref == 'refs/heads/main' && vars.PUBLIC_BLOG_API_ORIGIN || 'https://dev-api.signapse.cloud' }}
      BLOG_API_ORIGIN_CONFIGURED: ${{ github.ref == 'refs/heads/dev' && vars.DEV_PUBLIC_BLOG_API_ORIGIN != '' || github.ref == 'refs/heads/main' && vars.PUBLIC_BLOG_API_ORIGIN != '' }}
      SIGNAPSE_PUBLIC_ORIGIN: ${{ github.ref == 'refs/heads/dev' && vars.DEV_SIGNAPSE_PUBLIC_ORIGIN || github.ref == 'refs/heads/main' && vars.SIGNAPSE_PUBLIC_ORIGIN || 'https://landing.example.test' }}
      SIGNAPSE_LANDING_INDEXABLE: ${{ github.ref == 'refs/heads/main' && vars.SIGNAPSE_LANDING_INDEXABLE == 'true' && 'true' || 'false' }}
      SIGNAPSE_VERCEL_ANALYTICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment origins
        if: env.DEPLOY_TO_CLOUDFLARE == 'true'
        run: |
          node --input-type=module -e '
            const app = new URL(process.env.PUBLIC_APP_ORIGIN);
            const landing = new URL(process.env.SIGNAPSE_PUBLIC_ORIGIN);
            const contactApi = new URL(process.env.PUBLIC_CONTACT_API_ORIGIN);
            const blogApi = new URL(process.env.PUBLIC_BLOG_API_ORIGIN);
            if (app.protocol !== "https:" || app.origin === landing.origin || app.hostname === "www.signapse.cloud")
              throw new Error("PUBLIC_APP_ORIGIN must be a separate HTTPS application origin.");
            const expected = process.env.LANDING_ENVIRONMENT === "dev" ? "https://dev.signapse.cloud" : "https://signapse.cloud";
            if (landing.origin !== expected)
              throw new Error(`Landing origin must be ${expected} for this branch.`);
            if (process.env.CONTACT_API_ORIGIN_CONFIGURED !== "true")
              throw new Error("Set PUBLIC_CONTACT_API_ORIGIN in GitHub Variables before deploying the contact form.");
            if (contactApi.protocol !== "https:" || contactApi.username || contactApi.password || contactApi.pathname !== "/" || contactApi.search || contactApi.hash)
              throw new Error("PUBLIC_CONTACT_API_ORIGIN must be an HTTPS origin without credentials, path, query or fragment.");
            if (process.env.BLOG_API_ORIGIN_CONFIGURED !== "true")
              throw new Error("Set PUBLIC_BLOG_API_ORIGIN in GitHub Variables before deploying the public blog.");
            if (blogApi.protocol !== "https:" || blogApi.username || blogApi.password || blogApi.pathname !== "/" || blogApi.search || blogApi.hash)
              throw new Error("PUBLIC_BLOG_API_ORIGIN must be an HTTPS origin without credentials, path, query or fragment.");
          '

      - name: Check types
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_ENV: ${{ env.LANDING_ENVIRONMENT }}

      - name: Verify built deployment target
        run: node scripts/verify-deployment-target.mjs

      - name: Verify demo timelines
        run: pnpm test:models

      - name: Check release branch before publishing
        if: env.DEPLOY_TO_CLOUDFLARE == 'true'
        id: release_head
        shell: bash
        run: |
          current_head=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          [[ "$current_head" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$current_head" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release branch advanced; use the checked descendant release."
          fi

      - name: Deploy verified Worker and static assets to Cloudflare
        if: env.DEPLOY_TO_CLOUDFLARE == 'true' && steps.release_head.outputs.current == 'true'
        run: pnpm exec wrangler deploy --var "PUBLIC_BLOG_API_ORIGIN:${PUBLIC_BLOG_API_ORIGIN}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
